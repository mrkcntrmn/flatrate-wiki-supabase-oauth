flatrate-identity:
  forum:
    settings:
      heading: Community identity
      member_number: "Member #{number}"
      member_number_help: Your member number reflects when your Community account was created and is permanently yours.
      choose_appearance: Choose how your name appears
      member_identity: Use my permanent FlatRate.wiki member identity
      custom_nickname: Custom nickname
      custom_nickname_placeholder: Choose a custom nickname
      permanence: Your member number is permanent even if you use a custom nickname.
      save: Save
      saved: Saved
      error: Could not update how your name appears.
  api:
    reserved_tech_nickname: That nickname is reserved for FlatRate Community member identities.

flatrate-email-policy:
  email:
    subscriptions:
      new_post:
        body: |
          Hey {recipient_display_name}!

          {poster_display_name} posted in a discussion you're following:

          {title}

          View the new activity on FlatRate.wiki:
          {url}

    mentions:
      post_mentioned:
        body: |
          Hey {recipient_display_name}!

          {replier_display_name} replied to your post in:

          {title}

          View the reply on FlatRate.wiki:
          {url}

      user_mentioned:
        body: |
          Hey {recipient_display_name}!

          {mentioner_display_name} mentioned you in:

          {title}

          View the post on FlatRate.wiki:
          {url}

      group_mentioned:
        body: |
          Hey {recipient_display_name}!

          {mentioner_display_name} mentioned a group you're a member of in:

          {title}

          View the post on FlatRate.wiki:
          {url}

    follow_tags:
      new_discussion:
        body: |
          Hey {recipient_display_name}!

          {actor_display_name} started a new discussion:

          {title}

          View the discussion on FlatRate.wiki:
          {url}

      new_post:
        body: |
          Hey {recipient_display_name}!

          {actor_display_name} posted new activity in:

          {title}

          View the new activity on FlatRate.wiki:
          {url}
