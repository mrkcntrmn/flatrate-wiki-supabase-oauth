fof-oauth:
  admin:
    settings:
      providers:
        flatrate:
          description: Use FlatRate Wiki / Supabase OAuth 2.1. Register the exact callback URL shown below as a confidential OAuth app using client_secret_post. The SSO shared secret is optional here when FORUM_SSO_SHARED_SECRET is configured in the runtime environment.
          project_url_label: Supabase Project URL
          client_id_label: Client ID
          client_secret_label: Client Secret
          sso_shared_secret_label: Community SSO Shared Secret

  forum:
    log_in:
      with_flatrate_button: Continue with FlatRate.wiki
    providers:
      flatrate: FlatRate.wiki

  lib:
    providers:
      flatrate: FlatRate.wiki

flatrate-email-policy:
  email:
    subscriptions:
      new_post:
        body: |
          Hey {recipient_display_name}!

          {poster_display_name} posted in a discussion you're following:

          {title}

          Visit FlatRate.wiki to read the full reply:
          {url}

    mentions:
      post_mentioned:
        body: |
          Hey {recipient_display_name}!

          {replier_display_name} replied to your post in:

          {title}

          Visit FlatRate.wiki to read the full reply:
          {url}

      user_mentioned:
        body: |
          Hey {recipient_display_name}!

          {mentioner_display_name} mentioned you in:

          {title}

          Visit FlatRate.wiki to view the post:
          {url}

      group_mentioned:
        body: |
          Hey {recipient_display_name}!

          {mentioner_display_name} mentioned a group you're a member of in:

          {title}

          Visit FlatRate.wiki to view the post:
          {url}
