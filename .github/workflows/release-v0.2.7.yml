name: Publish v0.2.7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.7 if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.7 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.2.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target 8665e24313273784fd394b78fcc86d9e41247671 \
            --title "v0.2.7" \
            --notes $'FORUM-007: sequential public technician nicknames and OAuth fallback consistency.\n\n- New FlatRate-provisioned forum users receive public nicknames in `tech_<user count>` form.\n- The internal routing username remains the stable hashed `tech_<hash(sub)>` identity.\n- The OAuth fallback no longer calls nickname generation with the Supabase subject; both seamless SSO and fallback OAuth use the same race-safe provisioner.\n- Existing users and user-edited nicknames are not rewritten.'
