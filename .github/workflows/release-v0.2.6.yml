name: Release v0.2.6

on:
  push:
    branches:
      - chore/release-v0.2.6
    paths:
      - .github/workflows/release-v0.2.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.2.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.6 >/dev/null 2>&1 || \
            gh release create v0.2.6 \
              --target a7e323f69ce0ab313480229fb130bff6287b91fc \
              --title v0.2.6 \
              --notes 'SSO-006: allow the HMAC-authenticated server-to-server bridge POST routes through Flarum CSRF middleware while keeping all other API CSRF protection unchanged.'
