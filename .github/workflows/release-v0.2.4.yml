name: Release v0.2.4

on:
  push:
    branches:
      - chore/release-v0.2.4
    paths:
      - .github/workflows/release-v0.2.4.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.2.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.4 \
            --repo "$GITHUB_REPOSITORY" \
            --target 283bcb8622c5330bfd36cc577ab2e279658e0ed5 \
            --title "v0.2.4" \
            --notes "SSO-004 seamless Community session bootstrap: server-to-server provisioning, replay-protected HMAC bridge requests, short-lived single-use forum entry tickets, and preserved OAuth rollback/legacy-linking path."
